<!doctype html>
<!-- AI:ON 2026 팀 장장 시연용 가짜 페이지(실제 사례 재현: 주차 앱 사칭). 실제 서비스가 아니며 입력 내용은 어디로도 전송되지 않는다. -->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>한빛파킹 - 주차요금 결제</title>
<style>
body{font-family:sans-serif;margin:0;background:#eef8f6;color:#222}
header{background:#00826e;color:#fff;padding:20px;text-align:center}
main{max-width:420px;margin:0 auto;padding:20px}
.info{background:#fff;border-radius:12px;padding:14px;line-height:1.7;box-shadow:0 1px 4px #0002}
label{display:block;margin:12px 0 4px;font-weight:bold}
input{width:100%;box-sizing:border-box;padding:10px;border:1px solid #ccc;border-radius:8px}
button{margin-top:16px;width:100%;padding:12px;border:0;border-radius:8px;background:#00826e;color:#fff;font-size:16px}
footer{text-align:center;color:#aaa;font-size:11px;padding:20px}
</style>
</head>
<body>
<header><h1>한빛파킹</h1><p>앱 설치 없이 웹에서 바로 결제</p></header>
<main>
  <div class="info">구역번호를 입력하고 결제 수단을 등록하세요.<br>회원 확인을 위해 카드 비밀번호 앞 2자리와 생년월일이 필요합니다.</div>
  <form onsubmit="alert('시연용 페이지입니다. 입력 내용은 전송되지 않습니다.'); return false;">
    <label for="zone">구역번호</label><input id="zone" name="zone" type="text" placeholder="예: A-12">
    <label for="phone">휴대폰번호</label><input id="phone" name="phone" type="tel">
    <label for="birth">생년월일</label><input id="birth" name="birth" type="text" placeholder="YYMMDD">
    <label for="card">카드번호</label><input id="card" name="card" type="text">
    <label for="exp">유효기간</label><input id="exp" name="exp" type="text" placeholder="MM/YY">
    <label for="cvc">CVC</label><input id="cvc" name="cvc" type="text">
    <label for="pin">카드 비밀번호 앞 2자리</label><input id="pin" name="pin" type="password">
    <button type="submit">결제수단 등록 후 결제</button>
  </form>
</main>
<footer>AI:ON 2026 시연용 페이지 · 실제 서비스 아님</footer>
</body>
</html>
