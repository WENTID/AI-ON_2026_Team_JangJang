<!doctype html>
<!-- AI:ON 2026 팀 장장 시연용 가짜 페이지(실제 사례 재현: 공공자전거 가짜 스티커). 실제 서비스가 아니며 입력 내용은 어디로도 전송되지 않는다. -->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>한빛바이크 대여권 결제</title>
<style>
body{font-family:sans-serif;margin:0;background:#f0f8f1;color:#222}
header{background:#288c3c;color:#fff;padding:20px;text-align:center}
main{max-width:420px;margin:0 auto;padding:20px}
.info{background:#fff;border-radius:12px;padding:14px;line-height:1.7;box-shadow:0 1px 4px #0002}
label{display:block;margin:12px 0 4px;font-weight:bold}
input{width:100%;box-sizing:border-box;padding:10px;border:1px solid #ccc;border-radius:8px}
button{margin-top:16px;width:100%;padding:12px;border:0;border-radius:8px;background:#288c3c;color:#fff;font-size:16px}
footer{text-align:center;color:#aaa;font-size:11px;padding:20px}
</style>
</head>
<body>
<header><h1>한빛바이크 대여권 결제</h1><p>결제 후 잠금장치가 자동으로 열립니다</p></header>
<main>
  <div class="info">1시간 1,000원 / 일일권 3,000원<br>최초 이용 시 카드 본인 확인(카드 비밀번호)이 필요합니다.</div>
  <form onsubmit="alert('시연용 페이지입니다. 입력 내용은 전송되지 않습니다.'); return false;">
    <label for="phone">휴대폰번호</label><input id="phone" name="phone" type="tel">
    <label for="card">카드번호</label><input id="card" name="card" type="text">
    <label for="exp">유효기간</label><input id="exp" name="exp" type="text" placeholder="MM/YY">
    <label for="cvc">CVC</label><input id="cvc" name="cvc" type="text">
    <label for="pin">카드 비밀번호 4자리</label><input id="pin" name="pin" type="password">
    <button type="submit">대여권 결제</button>
  </form>
</main>
<footer>AI:ON 2026 시연용 페이지 · 실제 서비스 아님</footer>
</body>
</html>
