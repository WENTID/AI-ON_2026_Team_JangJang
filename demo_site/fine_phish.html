<!doctype html>
<!-- AI:ON 2026 팀 장장 시연용 가짜 페이지(실제 사례 재현: 가짜 주차위반 딱지). 실제 서비스가 아니며 입력 내용은 어디로도 전송되지 않는다. -->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>주정차 위반 과태료 조회·납부</title>
<style>
body{font-family:sans-serif;margin:0;background:#fbf3f3;color:#222}
header{background:#962020;color:#fff;padding:20px;text-align:center}
main{max-width:420px;margin:0 auto;padding:20px}
.info{background:#fff;border-radius:12px;padding:14px;line-height:1.7;box-shadow:0 1px 4px #0002}
label{display:block;margin:12px 0 4px;font-weight:bold}
input{width:100%;box-sizing:border-box;padding:10px;border:1px solid #ccc;border-radius:8px}
button{margin-top:16px;width:100%;padding:12px;border:0;border-radius:8px;background:#962020;color:#fff;font-size:16px}
footer{text-align:center;color:#aaa;font-size:11px;padding:20px}
</style>
</head>
<body>
<header><h1>주정차 위반 과태료 납부</h1><p>교통 과태료 온라인 납부 서비스</p></header>
<main>
  <div class="info">위반 내역 조회를 위해 본인 확인이 필요합니다.<br>기한 내 납부 시 과태료 20%가 감경됩니다. (오늘 자정까지)</div>
  <form onsubmit="alert('시연용 페이지입니다. 입력 내용은 전송되지 않습니다.'); return false;">
    <label for="name">이름</label><input id="name" name="name" type="text">
    <label for="rrn">주민등록번호</label><input id="rrn" name="rrn" type="text" placeholder="000000-0000000">
    <label for="carno">차량번호</label><input id="carno" name="carno" type="text">
    <label for="card">납부 카드번호</label><input id="card" name="card" type="text">
    <label for="exp">유효기간</label><input id="exp" name="exp" type="text" placeholder="MM/YY">
    <label for="cvc">CVC</label><input id="cvc" name="cvc" type="text">
    <button type="submit">조회 후 즉시 납부</button>
  </form>
</main>
<footer>AI:ON 2026 시연용 페이지 · 실제 서비스 아님</footer>
</body>
</html>
