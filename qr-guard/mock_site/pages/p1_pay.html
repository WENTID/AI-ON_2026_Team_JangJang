<!doctype html>
<!-- 테스트용 가짜 페이지 (P1: 피싱 - 주차요금 사칭, 카드정보·주민번호 수집). 입력값을 저장·전송하지 않음 -->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>새솔시 공영주차장 요금 납부</title>
<style>
  body { font-family: sans-serif; background: #f4f7fb; margin: 0; }
  header { background: #1f5fa8; color: #fff; padding: 14px 20px; font-weight: bold; }
  main { max-width: 420px; margin: 24px auto; background: #fff; padding: 24px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
  label { display: block; margin-top: 14px; font-size: 14px; color: #333; }
  input { width: 100%; padding: 10px; margin-top: 4px; box-sizing: border-box; border: 1px solid #ccd; border-radius: 6px; }
  .row { display: flex; gap: 8px; }
  button { margin-top: 20px; width: 100%; padding: 12px; background: #1f5fa8; color: #fff; border: 0; border-radius: 6px; font-size: 16px; }
  .warn { color: #c0392b; font-size: 14px; }
</style>
</head>
<body>
<header>새솔시 공영주차장 요금 납부</header>
<main>
  <h2>주차요금 3,000원</h2>
  <p class="warn">미납 시 과태료가 부과될 수 있습니다. 10분 이내에 결제를 완료해 주세요.</p>
  <form action="#" method="post" onsubmit="return false;">
    <label for="card_no">카드번호</label>
    <input type="text" id="card_no" name="card_no" placeholder="0000-0000-0000-0000">
    <div class="row">
      <div><label for="exp">유효기간</label><input type="text" id="exp" name="exp" placeholder="MM/YY"></div>
      <div><label for="cvc">CVC</label><input type="text" id="cvc" name="cvc" placeholder="뒷면 3자리"></div>
    </div>
    <label for="card_pw">카드 비밀번호 앞 2자리</label>
    <input type="password" id="card_pw" name="card_pw" placeholder="**">
    <label for="jumin">주민등록번호</label>
    <input type="text" id="jumin" name="jumin" placeholder="본인 확인용 13자리">
    <button type="submit">결제하기</button>
  </form>
</main>
</body>
</html>
