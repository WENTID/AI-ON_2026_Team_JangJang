<!doctype html>
<!-- AI:ON 2026 팀 장장 시연용 가짜 페이지(대조군: 안내문과 목적이 맞는 정상 페이지). 실제 서비스가 아니며 입력 내용은 어디로도 전송되지 않는다. -->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>맛나분식 테이블 주문</title>
<style>
body{font-family:sans-serif;margin:0;background:#fff4ef;color:#222}
header{background:#c84628;color:#fff;padding:20px;text-align:center}
main{max-width:420px;margin:0 auto;padding:20px}
.info{background:#fff;border-radius:12px;padding:14px;line-height:1.7;box-shadow:0 1px 4px #0002}
label{display:block;margin:12px 0 4px;font-weight:bold}
input{width:100%;box-sizing:border-box;padding:10px;border:1px solid #ccc;border-radius:8px}
button{margin-top:16px;width:100%;padding:12px;border:0;border-radius:8px;background:#c84628;color:#fff;font-size:16px}
footer{text-align:center;color:#aaa;font-size:11px;padding:20px}
</style>
</head>
<body>
<header><h1>맛나분식 테이블 주문</h1><p>7번 테이블</p></header>
<main>
  <div class="info">떡볶이 4,500원 · 김밥 3,500원 · 라면 4,000원 · 순대 5,000원<br>메뉴를 고르고 주문하면 자리로 가져다 드립니다. 결제는 카드사 결제창에서 진행됩니다.</div>
  <form onsubmit="alert('시연용 페이지입니다. 입력 내용은 전송되지 않습니다.'); return false;">
    <label for="menu">메뉴 선택</label><input id="menu" name="menu" type="text" placeholder="예: 떡볶이 1, 김밥 2">
    <label for="req">요청사항</label><input id="req" name="req" type="text" placeholder="예: 덜 맵게">
    <button type="submit">주문하기</button>
  </form>
</main>
<footer>AI:ON 2026 시연용 페이지 · 실제 서비스 아님</footer>
</body>
</html>
