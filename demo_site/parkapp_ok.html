<!doctype html>
<!-- AI:ON 2026 팀 장장 시연용 가짜 페이지(대조군: 안내문과 목적이 맞는 정상 페이지). 실제 서비스가 아니며 입력 내용은 어디로도 전송되지 않는다. -->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>한빛파킹 - 노상주차 요금 결제</title>
<style>
body{font-family:sans-serif;margin:0;background:#eef8f6;color:#222}
header{background:#00826e;color:#fff;padding:20px;text-align:center}
main{max-width:420px;margin:0 auto;padding:20px}
.info{background:#fff;border-radius:12px;padding:14px;line-height:1.7;box-shadow:0 1px 4px #0002}
label{display:block;margin:12px 0 4px;font-weight:bold}
input{width:100%;box-sizing:border-box;padding:10px;border:1px solid #ccc;border-radius:8px}
button{margin-top:16px;width:100%;padding:12px;border:0;border-radius:8px;background:#00826e;color:#fff;font-size:16px}
footer{text-align:center;color:#aaa;font-size:11px;padding:20px}
</style>
</head>
<body>
<header><h1>한빛파킹</h1><p>한빛시설관리공단 노상주차장</p></header>
<main>
  <div class="info">구역번호와 차량번호를 입력하면 주차 시간과 요금을 확인할 수 있습니다.<br>결제는 다음 화면의 카드사 결제창에서 진행됩니다.</div>
  <form onsubmit="alert('시연용 페이지입니다. 입력 내용은 전송되지 않습니다.'); return false;">
    <label for="zone">구역번호</label><input id="zone" name="zone" type="text" placeholder="예: A-12">
    <label for="carno">차량번호</label><input id="carno" name="carno" type="text" placeholder="예: 12가 3456">
    <button type="submit">주차요금 조회</button>
  </form>
</main>
<footer>AI:ON 2026 시연용 페이지 · 실제 서비스 아님</footer>
</body>
</html>
