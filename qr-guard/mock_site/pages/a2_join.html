<!doctype html>
<!-- 테스트용 가짜 페이지 (A2: 애매 - 카페 Wi-Fi, 휴대폰 번호 + 마케팅 동의). 입력값을 저장·전송하지 않음 -->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>카페 온새 무료 Wi-Fi</title>
<style>
  body { font-family: sans-serif; background: #f5efe6; margin: 0; }
  header { background: #6f4e37; color: #fff; padding: 14px 20px; font-weight: bold; }
  main { max-width: 400px; margin: 24px auto; background: #fff; padding: 24px; border-radius: 10px; }
  input[type=tel] { width: 100%; padding: 10px; margin-top: 6px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; }
  .agree { margin-top: 12px; font-size: 14px; }
  button { margin-top: 18px; width: 100%; padding: 12px; background: #6f4e37; color: #fff; border: 0; border-radius: 6px; }
</style>
</head>
<body>
<header>카페 온새 · 무료 Wi-Fi</header>
<main>
  <h3>Wi-Fi 연결하기</h3>
  <p>휴대폰 번호를 입력하고 약관에 동의하면 2시간 동안 무료 Wi-Fi를 사용할 수 있습니다.</p>
  <form action="#" method="post" onsubmit="return false;">
    <label for="phone">휴대폰 번호</label>
    <input type="tel" id="phone" name="phone" placeholder="010-0000-0000">
    <div class="agree"><label><input type="checkbox" name="agree_terms"> (필수) 이용약관 동의</label></div>
    <div class="agree"><label><input type="checkbox" name="agree_marketing"> (필수) 마케팅 정보 수신 동의</label></div>
    <button type="submit">연결하기</button>
  </form>
</main>
</body>
</html>
