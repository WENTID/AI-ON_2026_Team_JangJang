<!doctype html>
<!-- AI:ON 2026 팀 장장 시연용 가짜 페이지. 실제 서비스가 아니며 입력 내용은 어디로도 전송되지 않는다. -->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>가을맞이 경품 이벤트</title>
<style>
body{font-family:sans-serif;margin:0;background:#fff7ec;color:#222}
header{background:#ff7a2f;color:#fff;padding:22px;text-align:center}
main{max-width:420px;margin:0 auto;padding:20px}
.prize{background:#fff;border-radius:12px;padding:16px;margin-bottom:16px;box-shadow:0 1px 4px #0002}
label{display:block;margin:10px 0 4px;font-weight:bold}
input{width:100%;box-sizing:border-box;padding:10px;border:1px solid #ccc;border-radius:8px}
button{margin-top:16px;width:100%;padding:12px;border:0;border-radius:8px;background:#ff7a2f;color:#fff;font-size:16px}
footer{text-align:center;color:#aaa;font-size:11px;padding:20px}
</style>
</head>
<body>
<header><h1>🎁 가을맞이 경품 이벤트</h1><p>지금 응모하면 추첨을 통해 최신 스마트폰을 드립니다!</p></header>
<main>
  <div class="prize"><b>1등</b> 최신 스마트폰 (1명) · <b>2등</b> 무선 이어폰 (10명) · <b>3등</b> 커피 쿠폰 (100명)</div>
  <form onsubmit="alert('시연용 페이지입니다. 입력 내용은 전송되지 않습니다.'); return false;">
    <label for="name">이름</label><input id="name" name="name">
    <label for="phone">휴대폰</label><input id="phone" name="phone" type="tel">
    <label for="addr">경품 받을 주소</label><input id="addr" name="addr">
    <button type="submit">응모하기</button>
  </form>
</main>
<footer>AI:ON 2026 시연용 페이지 · 실제 서비스 아님</footer>
</body>
</html>
