<!doctype html>
<!-- AI:ON 2026 팀 장장 시연용 가짜 페이지(실제 사례 재현: 주차 정산기 가짜 스티커). 실제 서비스가 아니며 입력 내용은 어디로도 전송되지 않는다. -->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>공영주차장 주차요금 간편결제</title>
<style>
body{font-family:sans-serif;margin:0;background:#f2f6fb;color:#222}
header{background:#1e5aaa;color:#fff;padding:20px;text-align:center}
main{max-width:420px;margin:0 auto;padding:20px}
.info{background:#fff;border-radius:12px;padding:14px;line-height:1.7;box-shadow:0 1px 4px #0002}
label{display:block;margin:12px 0 4px;font-weight:bold}
input{width:100%;box-sizing:border-box;padding:10px;border:1px solid #ccc;border-radius:8px}
button{margin-top:16px;width:100%;padding:12px;border:0;border-radius:8px;background:#1e5aaa;color:#fff;font-size:16px}
footer{text-align:center;color:#aaa;font-size:11px;padding:20px}
</style>
</head>
<body>
<header><h1>주차요금 간편결제</h1><p>공영주차장 모바일 정산</p></header>
<main>
  <div class="info">차량번호와 카드 정보를 입력하면 주차요금이 바로 결제됩니다.<br>미결제 시 출차가 제한될 수 있습니다.</div>
  <form onsubmit="alert('시연용 페이지입니다. 입력 내용은 전송되지 않습니다.'); return false;">
    <label for="carno">차량번호</label><input id="carno" name="carno" type="text" placeholder="예: 12가 3456">
    <label for="card">카드번호</label><input id="card" name="card" type="text" placeholder="0000-0000-0000-0000">
    <label for="exp">유효기간</label><input id="exp" name="exp" type="text" placeholder="MM/YY">
    <label for="cvc">CVC (카드 뒷면 3자리)</label><input id="cvc" name="cvc" type="text">
    <button type="submit">결제하기</button>
  </form>
</main>
<footer>AI:ON 2026 시연용 페이지 · 실제 서비스 아님</footer>
</body>
</html>
