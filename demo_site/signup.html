<!doctype html>
<!-- AI:ON 2026 팀 장장 시연용 가짜 페이지. 실제 서비스가 아니며 입력 내용은 어디로도 전송되지 않는다. -->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>간편 회원가입</title>
<style>
body{font-family:sans-serif;margin:0;background:#f4f6fb;color:#222}
header{background:#3b5bdb;color:#fff;padding:20px;text-align:center}
main{max-width:420px;margin:0 auto;padding:20px}
label{display:block;margin:12px 0 4px;font-weight:bold}
input{width:100%;box-sizing:border-box;padding:10px;border:1px solid #ccc;border-radius:8px}
button{margin-top:18px;width:100%;padding:12px;border:0;border-radius:8px;background:#3b5bdb;color:#fff;font-size:16px}
p.note{color:#666;font-size:13px}
footer{text-align:center;color:#aaa;font-size:11px;padding:20px}
</style>
</head>
<body>
<header><h1>간편 회원가입</h1><p>가입하고 다양한 혜택을 받아 보세요</p></header>
<main>
  <p class="note">회원가입 후 맞춤 쇼핑 혜택과 할인 쿠폰을 문자로 보내 드립니다.</p>
  <form onsubmit="alert('시연용 페이지입니다. 입력 내용은 전송되지 않습니다.'); return false;">
    <label for="name">이름</label><input id="name" name="name">
    <label for="birth">생년월일 (8자리)</label><input id="birth" name="birth">
    <label for="phone">휴대폰</label><input id="phone" name="phone" type="tel">
    <button type="submit">가입하고 쿠폰 받기</button>
  </form>
</main>
<footer>AI:ON 2026 시연용 페이지 · 실제 서비스 아님</footer>
</body>
</html>
