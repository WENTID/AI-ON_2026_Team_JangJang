<!doctype html>
<!-- AI:ON 2026 팀 장장 시연용 가짜 페이지. 실제 서비스가 아니며 입력 내용은 어디로도 전송되지 않는다. -->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>VIP 주식 정보방 무료 입장</title>
<style>
body{font-family:sans-serif;margin:0;background:#0f1b2d;color:#fff}
main{max-width:420px;margin:0 auto;padding:28px 20px;text-align:center}
.box{background:#1b2c47;border-radius:14px;padding:18px;margin:18px 0;text-align:left;line-height:1.7}
input{width:100%;box-sizing:border-box;padding:11px;border:0;border-radius:8px;margin-top:6px}
button{margin-top:14px;width:100%;padding:13px;border:0;border-radius:8px;background:#ffd400;color:#000;font-size:16px;font-weight:bold}
footer{text-align:center;color:#556;font-size:11px;padding:20px}
</style>
</head>
<body>
<main>
  <h1>📈 VIP 주식 정보방</h1>
  <p>전문가가 매일 급등 예상 종목을 무료로 알려 드립니다.</p>
  <div class="box">✔ 하루 3회 종목 추천<br>✔ 회원 평균 수익률 32%<br>✔ 오늘만 무료 입장 (선착순 50명)</div>
  <form onsubmit="alert('시연용 페이지입니다. 입력 내용은 전송되지 않습니다.'); return false;">
    <label for="phone">입장 안내를 받을 휴대폰</label><input id="phone" name="phone" type="tel">
    <button type="submit">오픈채팅방 입장하기</button>
  </form>
</main>
<footer>AI:ON 2026 시연용 페이지 · 실제 서비스 아님</footer>
</body>
</html>
