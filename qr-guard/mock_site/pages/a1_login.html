<!doctype html>
<!-- 테스트용 가짜 페이지 (A1: 애매 - 안내 문구 없는 쇼핑몰 로그인). 입력값을 저장·전송하지 않음 -->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>데일리샵 로그인</title>
<style>
  body { font-family: sans-serif; background: #fafafa; margin: 0; }
  header { background: #222; color: #fff; padding: 14px 20px; font-weight: bold; }
  main { max-width: 380px; margin: 30px auto; background: #fff; padding: 24px; border-radius: 10px; }
  input { width: 100%; padding: 10px; margin-top: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; }
  button { margin-top: 18px; width: 100%; padding: 12px; background: #222; color: #fff; border: 0; border-radius: 6px; }
</style>
</head>
<body>
<header>DAILY SHOP</header>
<main>
  <h3>로그인</h3>
  <p>회원 전용 혜택을 받으려면 로그인하세요.</p>
  <form action="#" method="post" onsubmit="return false;">
    <input type="text" name="username" placeholder="아이디">
    <input type="password" name="password" placeholder="비밀번호">
    <button type="submit">로그인</button>
  </form>
  <p><a href="#">회원가입</a> · <a href="#">아이디/비밀번호 찾기</a></p>
</main>
</body>
</html>
